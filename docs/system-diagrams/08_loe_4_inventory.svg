  <text x="978.0" y="339.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#3E2723">4.5 Movement history</text>
  <text x="978.0" y="354.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">chronological event log</text>
  <rect x="1090.0" y="304.0" width="210.0" height="78.0" rx="10" ry="10" fill="#FBEFD4" stroke="#C97C1F" stroke-width="1.6"/>
  <text x="1195.0" y="332.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#3E2723">4.6 FEFO pools</text>
  <text x="1195.0" y="347.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">purchase vs package</text>
  <text x="1195.0" y="362.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">remaining</text>
  <rect x="60.0" y="520.0" width="1460.0" height="210.0" rx="10" ry="10" fill="#FFFFFF" stroke="#C5D6B8" stroke-width="1.6"/>
  <text x="790.0" y="608.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#3E2723">Purchase-unit stock-in moves whole containers and the matching package pool. Package-unit stock-in adds loose contents only (total_package_stock_ins).</text>
  <text x="790.0" y="622.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#3E2723">Treatments do not reduce total_purchase_stocks for packaged items — an opened bottle stays on the shelf until a whole-container stock-out.</text>
  <text x="790.0" y="635.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#3E2723">Out of stock means both pools are empty. Low-stock and expiry alerts use SYSTEM_SETTINGS, not a second invented threshold column on ITEM.</text>
  <text x="790.0" y="649.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#3E2723">Categories/units live in CatalogService and are configured under 7.4 Settings. Manager donation stock-in reuses 4.3 with type=donated.</text>
