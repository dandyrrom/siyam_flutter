<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="860"
     viewBox="0 0 1480 860" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7D6D"/>
    </marker>
  </defs>
  <rect x="0.0" y="0.0" width="1480.0" height="860.0" rx="0" ry="0" fill="#FFF8F0" stroke="#FFF8F0" stroke-width="0"/>
  <rect x="0.0" y="0.0" width="1480.0" height="64.0" rx="0" ry="0" fill="#FFFFFF" stroke="#C5D6B8" stroke-width="1"/>
  <rect x="0.0" y="0.0" width="8.0" height="64.0" rx="0" ry="0" fill="#93B873" stroke="#93B873" stroke-width="0"/>
  <text x="24.0" y="28.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#3E2723">Level of Explosion — Cross-module stock flow</text>
  <text x="24.0" y="50.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#7A756E">How inventory actually moves between 4.0, 5.0, 6.0, and 3.2. Not a fourth diagram type — it is the shared explosion of stock.</text>
  <rect x="0.0" y="824.0" width="1480.0" height="36.0" rx="0" ry="0" fill="#FFFFFF" stroke="#C5D6B8" stroke-width="1"/>
  <text x="24.0" y="846.0" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#7A756E">SIYAM — Animal Sanctuary Management System. Drawn from current modules, services, and updated_db.md.</text>
  <rect x="80.0" y="120.0" width="240.0" height="80.0" rx="10" ry="10" fill="#E9F1E2" stroke="#5A6E4E" stroke-width="1.6"/>
  <text x="200.0" y="156.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#3E2723">5.3 Record purchase</text>
  <text x="200.0" y="171.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">PURCHASE + PURCHASE_ITEM</text>
  <rect x="400.0" y="120.0" width="280.0" height="80.0" rx="10" ry="10" fill="#FBEFD4" stroke="#C97C1F" stroke-width="1.6"/>
  <text x="540.0" y="156.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#3E2723">6.4 / 6.5 Donation stock-in</text>
  <text x="540.0" y="171.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">DONATION + DONATION_ITEM</text>
  <rect x="780.0" y="120.0" width="240.0" height="80.0" rx="10" ry="10" fill="#E6F1F8" stroke="#2D82C4" stroke-width="1.6"/>
  <text x="900.0" y="156.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#3E2723">4.3 Generic Stock In</text>
  <text x="900.0" y="171.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">same batch rules</text>
  <rect x="1100.0" y="120.0" width="280.0" height="80.0" rx="10" ry="10" fill="#FFFFFF" stroke="#5A6E4E" stroke-width="1.6"/>
  <text x="1240.0" y="149.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#3E2723">ITEM pools</text>
  <text x="1240.0" y="164.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">purchase + package + FEFO</text>
  <text x="1240.0" y="179.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">qty_remaining</text>
  <line x1="320.0" y1="160.0" x2="400.0" y2="160.0" stroke="#6B7D6D" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="680.0" y1="160.0" x2="780.0" y2="160.0" stroke="#6B7D6D" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="1020.0" y1="160.0" x2="1100.0" y2="160.0" stroke="#6B7D6D" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="200.0" y1="200.0" x2="1240.0" y2="200.0" stroke="#6B7D6D" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
  <rect x="670.0" y="189.0" width="140.0" height="16.0" rx="3" ry="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
  <text x="740.0" y="201.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" font-style="normal" fill="#7A756E">stock-in increases batches and pools</text>
  <rect x="200.0" y="320.0" width="280.0" height="90.0" rx="10" ry="10" fill="#E6F1F8" stroke="#2D82C4" stroke-width="1.6"/>
  <text x="340.0" y="354.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#3E2723">3.2.4 Treatment deduction</text>
  <text x="340.0" y="369.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">package pool if packaged; purchase</text>
  <text x="340.0" y="384.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">pool if not</text>
  <rect x="620.0" y="320.0" width="280.0" height="90.0" rx="10" ry="10" fill="#FBEFD4" stroke="#C97C1F" stroke-width="1.6"/>
  <text x="760.0" y="354.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#3E2723">4.4 Stock Out</text>
  <text x="760.0" y="369.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">waste / expired / adjustment at</text>
  <text x="760.0" y="384.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">purchase-unit</text>
  <rect x="1040.0" y="320.0" width="280.0" height="90.0" rx="10" ry="10" fill="#FBEFD4" stroke="#C97C1F" stroke-width="1.6"/>
  <text x="1180.0" y="361.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#3E2723">6.7 FIFO impact</text>
  <text x="1180.0" y="376.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" font-style="normal" fill="#3E2723">replay batches for the donor&#x27;s gifts</text>
  <line x1="1240.0" y1="200.0" x2="340.0" y2="320.0" stroke="#6B7D6D" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="1240.0" y1="200.0" x2="760.0" y2="320.0" stroke="#6B7D6D" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="1240.0" y1="200.0" x2="1180.0" y2="320.0" stroke="#6B7D6D" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="80.0" y="500.0" width="1320.0" height="250.0" rx="10" ry="10" fill="#FFFFFF" stroke="#C5D6B8" stroke-width="1.6"/>
  <text x="740.0" y="608.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#3E2723">Canonical remaining qty lives on each PURCHASE_ITEM / DONATION_ITEM row (qty_remaining).</text>
  <text x="740.0" y="622.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#3E2723">Headline stock on the inventory page is ITEM.stock_count_mode: package pool for deductible packaged items, else purchase pool.</text>
  <text x="740.0" y="635.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#3E2723">Opened packaged stock can show as In Stock while total_package_stocks is 0, as long as empty containers remain (total_purchase_stocks &gt; 0).</text>
  <text x="740.0" y="649.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#3E2723">Impact is independent of those headline figures. Discarded qty comes from stock-out against the donor&#x27;s FIFO slice, not from a stored ITEM.used column.</text>
</svg>
