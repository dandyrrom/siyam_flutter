  <text x="790.0" y="642.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#3E2723">Walk-in / drop-off on DONATION is descriptive. donorid, donor_name, and subid are independently optional.</text>
