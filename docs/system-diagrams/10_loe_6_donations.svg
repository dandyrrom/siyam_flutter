  <text x="790.0" y="669.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#3E2723">Donor notifications (approved, received, impact) are derived from this same data — there is no separate notification table.</text>
