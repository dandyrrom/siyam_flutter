  <text x="1300.0" y="486.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" font-style="normal" fill="#3E2723">ROP columns on system_settings</text>
  <rect x="50.0" y="600.0" width="1460.0" height="280.0" rx="10" ry="10" fill="#FFFFFF" stroke="#C5D6B8" stroke-width="1.6"/>
  <text x="780.0" y="723.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#3E2723">FEFO identity is the stock-in row itself (PURCHASE_ITEM / DONATION_ITEM). There is no separate stock_batches table in updated_db.md.</text>
  <text x="780.0" y="737.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#3E2723">ITEM.total_purchase_stocks vs total_package_stocks is the dual-pool model. total_package_stock_ins records loose package-unit stock-in.</text>
  <text x="780.0" y="750.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#3E2723">SUBMISSION.donorid is required (logged-in donor). DONATION.donorid is optional (walk-in may have no account).</text>
  <text x="780.0" y="764.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="normal" fill="#3E2723">Do not treat siyam_db_wo_rls.md or schema.md as current. CLAUDE.md names updated_db.md as the schema source of truth.</text>
