name: siyam_flutter
description: SIYAM Animal Sanctuary Management System (Flutter Web port)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  supabase_flutter: ^2.16.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  image_path: "assets/branding/pet-house.png"
  android: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/pet-house.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
